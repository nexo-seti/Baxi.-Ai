
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070b">
<title>Baxi AI</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;height:100dvh;overflow:hidden;
 background:
 radial-gradient(circle at 5% 5%,#49307855,transparent 35%),
 radial-gradient(circle at 95% 95%,#176c8950,transparent 35%),
 #07070b;
 color:white;font-family:Inter,-apple-system,Segoe UI,Roboto,sans-serif
}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
.app{
 max-width:800px;margin:auto;height:100dvh;
 display:flex;flex-direction:column;padding:14px;
 gap:12px
}
.glass{
 background:#ffffff0b;
 border:1px solid #ffffff19;
 backdrop-filter:blur(24px) saturate(150%);
 -webkit-backdrop-filter:blur(24px) saturate(150%);
 box-shadow:inset 0 1px #ffffff17,0 10px 35px #0005
}
header{
 height:65px;flex:none;border-radius:23px;
 display:flex;align-items:center;justify-content:space-between;
 padding:9px
}
button.icon{
 width:44px;height:44px;border-radius:50%;
 background:#ffffff0b;border:1px solid #ffffff18;
 display:grid;place-items:center;transition:.18s
}
button:active{transform:scale(.93)}
button.icon:hover{background:#ffffff1b}
svg{
 width:21px;height:21px;fill:none;stroke:currentColor;
 stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round
}
.brand{
 background:#ffffff0b;border:1px solid #ffffff18;
 border-radius:99px;padding:10px 15px;
 display:flex;align-items:center;gap:9px
}
.brand b{
 font-size:18px;background:linear-gradient(white,#aaa);
 color:transparent;background-clip:text
}
.version{font-size:11px;color:#aaa;background:#ffffff12;padding:4px 7px;border-radius:20px}
#chat{
 flex:1;min-height:0;overflow-y:auto;
 display:flex;flex-direction:column;gap:12px;
 padding:10px 3px;scrollbar-width:thin
}
.welcome{
 margin:auto;text-align:center;max-width:430px;padding:20px
}
.logo{
 width:65px;height:65px;margin:auto auto 18px;
 display:grid;place-items:center;border-radius:23px;
 background:linear-gradient(135deg,#9565ff66,#42b9dd55);
 border:1px solid #ffffff30;
 box-shadow:0 0 40px #8d64ff33
}
.welcome h1{font-size:27px;margin:0 0 10px}
.welcome p{font-size:14px;color:#999;line-height:1.6}
.message{
 max-width:88%;padding:13px 15px;border-radius:18px;
 white-space:pre-wrap;overflow-wrap:anywhere;
 line-height:1.55;font-size:14px
}
.user{
 align-self:flex-end;background:#8662c844;
 border:1px solid #a78aff44;border-bottom-right-radius:5px
}
.bot{
 align-self:flex-start;background:#ffffff0d;
 border:1px solid #ffffff17;border-bottom-left-radius:5px
}
.time{font-size:10px;color:#888;display:block;margin-top:7px}
.composer{
 min-height:63px;flex:none;border-radius:99px;
 display:flex;align-items:center;gap:7px;padding:8px
}
.composer:focus-within{
 border-color:#9c7aff88;
 box-shadow:0 0 25px #8761ff22
}
.composer input[type=text]{
 flex:1;min-width:0;background:transparent;
 border:0;outline:0;padding:10px 4px;font-size:14px
}
.composer input::placeholder{color:#888}
.send{
 width:46px;height:46px;border-radius:50%;
 border:1px solid #ffffff55;
 background:linear-gradient(135deg,#9568ed,#43a6cb);
 box-shadow:0 0 20px #8c63e944;
 display:grid;place-items:center
}
#fileInput{display:none}
#status{text-align:center;font-size:11px;color:#888;min-height:13px}
.panel{
 position:fixed;inset:0;background:#000b;
 display:none;align-items:flex-end;justify-content:center;
 padding:14px;z-index:10
}
.panel.open{display:flex}
.sheet{
 width:100%;max-width:500px;background:#191821;
 border:1px solid #ffffff22;border-radius:24px;
 padding:20px;max-height:80dvh;overflow:auto
}
.sheet h2{font-size:19px;margin:0 0 15px}
.action{
 padding:12px 15px;border-radius:13px;
 background:#ffffff10;border:1px solid #ffffff20;
 margin:4px
}
.field{
 width:100%;padding:12px;background:#ffffff0b;
 border:1px solid #ffffff25;border-radius:12px;
 margin:8px 0
}
@media(max-width:420px){
 .app{padding:10px}
 .message{max-width:94%}
}
</style>
</head>

<body>
<div class="app">

<!-- ШАПКА -->
<header class="glass">
<button class="icon" id="history" aria-label="История">
<svg viewBox="0 0 24 24">
<path d="M20 11a8 8 0 1 1-2-5"/>
<path d="M20 4v5h-5"/>
<path d="M12 7v5l3 2"/>
</svg>
</button>

<button class="brand" id="about">
<b>Baxi</b>
<span class="version">v 1.2</span>
<span>⌄</span>
</button>

<button class="icon" id="settings" aria-label="Настройки">
<svg viewBox="0 0 24 24">
<circle cx="12" cy="12" r="3"/>
<path d="M19 13.5l2 1.5-2 3-3-.5-2 2.5h-4L9 17l-3 .5-2-3 2-2v-4l-2-2 2-3 3 .5 2-2.5h4L16 4l3-.5 2 3-2 2z"/>
</svg>
</button>
</header>

<!-- ЧАТ -->
<main id="chat">
<div class="welcome" id="welcome">
<div class="logo">
<svg viewBox="0 0 24 24">
<path d="M12 3v18M3 12h18M5.5 5.5l13 13m0-13-13 13"/>
</svg>
</div>
<h1>Привет! Я Baxi</h1>
<p>Твой интеллектуальный помощник. Задавай вопросы, прикрепляй файлы и общайся со мной.</p>
</div>
</main>

<div id="status">Baxi AI · готов к работе</div>

<!-- ПОЛЕ ВВОДА -->
<form class="composer glass" id="form">

<button class="icon" type="button" id="attach" aria-label="Файл">
<svg viewBox="0 0 24 24">
<path d="M12 5v14M5 12h14"/>
</svg>
</button>

<input type="file" id="fileInput" hidden>
<input type="text" id="message" placeholder="Сообщение…" autocomplete="off">

<button class="icon" type="button" id="mic" aria-label="Микрофон">
<svg viewBox="0 0 24 24">
<rect x="9" y="3" width="6" height="12" rx="3"/>
<path d="M5 11a7 7 0 0 0 14 0M12 18v3"/>
</svg>
</button>

<button class="send" type="submit" aria-label="Отправить">
<svg viewBox="0 0 24 24">
<path d="M12 19V5m-6 6 6-6 6 6"/>
</svg>
</button>
</form>
</div>

<!-- НАСТРОЙКИ -->
<div class="panel" id="panel">
<div class="sheet">
<h2 id="panelTitle">Настройки Baxi</h2>
<div id="panelContent"></div>
<button class="action" id="close">Закрыть</button>
</div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);

const chat = $('chat');
const input = $('message');

let history = [];
let attached = null;

try {
history = JSON.parse(localStorage.getItem('baxi_history') || '[]');
} catch(e) {
history = [];
}

function save(){
localStorage.setItem('baxi_history',JSON.stringify(history));
}

function showMessage(text,type){
$('welcome')?.remove();

const div=document.createElement('div');
div.className='message '+type;
div.textContent=text;

const time=document.createElement('span');
time.className='time';
time.textContent=new Date().toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});

div.appendChild(time);
chat.appendChild(div);
chat.scrollTop=chat.scrollHeight;
}

function render(){
chat.innerHTML='';
if(!history.length){
chat.innerHTML='<div class="welcome" id="welcome"><div class="logo">✦</div><h1>Привет! Я Baxi</h1><p>Задавай вопросы и общайся со мной.</p></div>';
return;
}
history.forEach(m=>showMessage(m.text,m.role));
}

function answer(text){
const t=text.toLowerCase();

if(/привет|здравствуй|добрый/.test(t))
return 'Привет! Я Baxi. Рад начать разговор! Чем могу помочь?';

if(/как дела|как ты/.test(t))
return 'Я готов работать и помогать тебе! Какой у тебя вопрос?';

if(/кто ты|что умеешь/.test(t))
return 'Я Baxi AI — твой помощник. Могу вести диалог, помогать с текстами, программированием и простыми задачами. Для полноценной генерации ответов требуется подключение языковой модели.';

if(/спасибо/.test(t))
return 'Всегда пожалуйста!';

if(/дата|число/.test(t))
return 'Сегодня: '+new Date().toLocaleDateString('ru-RU');

if(/время|час/.test(t))
return 'Сейчас: '+new Date().toLocaleTimeString('ru-RU');

if(/2\+2|два плюс два/.test(t))
return 'Ответ: 4.';

if(/помощь/.test(t))
return 'Напиши вопрос обычным языком. Я постараюсь помочь.';

return 'Я получил твой вопрос: "'+text+'".\n\nСейчас я работаю в локальном режиме. Чтобы давать полноценные интеллектуальные ответы на любые вопросы, необходимо подключить настоящую языковую модель через Python-сервер.';
}

async function send(){
const text=input.value.trim();
if(!text && !attached)return;

let fullText=text;

if(attached){
try{
const content=await attached.text();
fullText += '\n\nФайл '+attached.name+':\n'+content.slice(0,10000);
}catch(e){}
}

if(attached){
showMessage('Прикреплён файл: '+attached.name,'user');
}

if(text){
history.push({text,role:'user'});
showMessage(text,'user');
}

input.value='';
attached=null;

save();

$('status').textContent='Baxi думает…';

setTimeout(()=>{
const reply=answer(fullText);
history.push({text:reply,role:'bot'});
showMessage(reply,'bot');
save();
$('status').textContent='Baxi AI · готов';
},400);
}

$('form').addEventListener('submit',e=>{
e.preventDefault();
send();
});

$('attach').onclick=()=>$('fileInput').click();

$('fileInput').onchange=e=>{
attached=e.target.files[0]||null;
if(attached){
$('status').textContent='Прикреплён: '+attached.name;
}
e.target.value='';
};

$('mic').onclick=()=>{
const Speech=window.SpeechRecognition||window.webkitSpeechRecognition;

if(!Speech){
$('status').textContent='Голосовой ввод недоступен. Используй микрофон клавиатуры телефона.';
input.focus();
return;
}

const recognition=new Speech();
recognition.lang='ru-RU';
recognition.interimResults=false;

recognition.onstart=()=>{
$('status').textContent='Слушаю тебя…';
};

recognition.onresult=e=>{
input.value += (input.value?' ':'')+e.results[0][0].transcript;
$('status').textContent='Голос распознан';
};

recognition.onerror=()=>{
$('status').textContent='Проверь разрешение микрофона.';
};

recognition.onend=()=>{
if($('status').textContent==='Слушаю тебя…')
$('status').textContent='Готово';
};

try{recognition.start();}
catch(e){$('status').textContent='Не удалось включить микрофон.';}
};

$('settings').onclick=()=>{
$('panelTitle').textContent='Настройки';

$('panelContent').innerHTML=`
<p>Настройки Baxi AI</p>
<p>Сообщений: ${history.length}</p>
<button class="action" id="export">Экспорт истории</button>
<button class="action" id="clear">Очистить историю</button>
`;

$('panel').classList.add('open');

$('export').onclick=()=>{
const blob=new Blob([JSON.stringify(history,null,2)],{type:'application/json'});
const url=URL.createObjectURL(blob);
const a=document.createElement('a');
a.href=url;
a.download='baxi-history.json';
a.click();
URL.revokeObjectURL(url);
};

$('clear').onclick=()=>{
if(confirm('Удалить всю историю?')){
history=[];
save();
render();
$('panel').classList.remove('open');
}
};
};

$('history').onclick=()=>{
render();
$('status').textContent='История сообщений загружена';
};

$('about').onclick=()=>{
$('panelTitle').textContent='О Baxi AI';
$('panelContent').innerHTML='<p>Baxi AI v1.2</p><p>Локальный режим. Для полноценного ИИ подключи языковую модель.</p>';
$('panel').classList.add('open');
};

$('close').onclick=()=>$('panel').classList.remove('open');

$('panel').onclick=e=>{
if(e.target===$('panel'))$('panel').classList.remove('open');
};

render();
})();
</script>
</body>
  </html>
