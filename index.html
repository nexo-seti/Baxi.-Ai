<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#08080d"><meta name="description" content="Baxi — персональный ИИ-чат">
<title>Baxi AI</title>
<style>
:root{color-scheme:dark;--bg:#07070b;--glass:rgba(255,255,255,.055);--line:rgba(255,255,255,.11);--muted:#9292a3;--purple:#9875ff;--cyan:#62c9ef}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:#f7f7fb;font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
body{min-height:100dvh;overflow:hidden;background:radial-gradient(ellipse at 8% 3%,rgba(116,67,196,.19),transparent 35%),radial-gradient(ellipse at 95% 95%,rgba(39,132,169,.16),transparent 34%),#07070b}
button,input,textarea{font:inherit;color:inherit}button{cursor:pointer}
.app{height:100dvh;max-width:820px;margin:auto;display:flex;flex-direction:column;padding:14px 14px calc(12px + env(safe-area-inset-bottom));gap:12px}
.glass{background:var(--glass);backdrop-filter:blur(25px) saturate(150%);-webkit-backdrop-filter:blur(25px) saturate(150%);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),0 12px 38px rgba(0,0,0,.24)}
header{height:68px;flex:none;border-radius:24px;display:flex;align-items:center;justify-content:space-between;padding:0 11px}
.icon-btn{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.09);color:#dedee8;transition:.18s}
.icon-btn:hover,.chip:hover{background:rgba(255,255,255,.1);transform:translateY(-1px)}button:active{transform:scale(.93)}
svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.brand{display:flex;align-items:center;gap:9px;border-radius:999px;padding:8px 13px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.brand strong{font-size:17px;letter-spacing:.2px;background:linear-gradient(#fff,#aaaabb);background-clip:text;color:transparent}
.version{font-size:11px;color:#aaa9ba;background:rgba(255,255,255,.08);padding:4px 7px;border-radius:20px}
.chevron{width:13px;height:13px;color:#aaa}
main{flex:1;min-height:0;overflow-y:auto;padding:14px 4px 22px;scrollbar-width:thin;scrollbar-color:#343342 transparent}
.welcome{height:100%;min-height:280px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:25px}
.orb{width:66px;height:66px;border-radius:23px;background:linear-gradient(145deg,rgba(154,112,255,.28),rgba(76,188,222,.18));border:1px solid rgba(255,255,255,.17);display:grid;place-items:center;box-shadow:0 0 55px rgba(126,95,222,.2),inset 0 1px 0 #ffffff30;margin-bottom:22px}
.orb svg{width:30px;height:30px}
.welcome h1{font-size:clamp(26px,6vw,34px);margin:0 0 10px;letter-spacing:-1px}.welcome p{color:var(--muted);font-size:14px;line-height:1.6;max-width:390px;margin:0}
.suggestions{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:24px}
.chip{border:1px solid var(--line);background:rgba(255,255,255,.045);color:#c9c8d5;padding:10px 13px;border-radius:18px;font-size:12px;transition:.18s}
.message{display:flex;margin:12px 0;animation:appear .2s ease}.message.user{justify-content:flex-end}.bubble{max-width:min(86%,600px);padding:13px 15px;border-radius:19px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.09);line-height:1.55;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}.user .bubble{background:linear-gradient(135deg,rgba(133,99,222,.26),rgba(72,155,184,.17));border-color:rgba(165,142,255,.22)}
.msg-tools{display:flex;gap:7px;margin:6px 3px 0}.tiny{border:0;background:transparent;color:#858596;font-size:11px;padding:4px}.tiny:hover{color:white}
.composer{flex:none;min-height:64px;border-radius:999px;display:flex;align-items:center;gap:7px;padding:8px 9px;transition:.2s}
.composer:focus-within{border-color:rgba(155,122,255,.55);box-shadow:0 0 0 3px rgba(139,102,237,.09),0 0 30px rgba(118,86,208,.12),inset 0 1px 0 #ffffff18}
.composer input{min-width:0;flex:1;background:transparent;border:0;outline:0;font-size:14px;padding:0 5px}.composer input::placeholder{color:#777787}
.send{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(211,197,255,.3);background:linear-gradient(145deg,rgba(151,111,255,.68),rgba(78,173,205,.56));box-shadow:inset 0 1px 0 #ffffff55,0 0 24px rgba(124,94,225,.2);transition:.18s}
.send:hover{filter:brightness(1.12);transform:translateY(-1px)}.send svg{width:20px}
.status{font-size:10px;color:#737383;text-align:center;margin-top:-5px}
.overlay{position:fixed;inset:0;background:#0009;backdrop-filter:blur(8px);display:none;align-items:flex-end;justify-content:center;z-index:5;padding:14px}.overlay.show{display:flex}
.sheet{width:min(100%,520px);max-height:82dvh;overflow:auto;border-radius:25px;padding:18px;background:rgba(24,24,34,.96);border:1px solid var(--line);box-shadow:0 20px 70px #0009}
.sheet-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}.sheet h2{font-size:18px;margin:0}.field{display:block;margin:13px 0;color:#b8b8c7;font-size:12px}.field input{display:block;width:100%;margin-top:7px;border:1px solid var(--line);background:#ffffff0b;border-radius:13px;padding:12px;outline:0;font-size:13px}
.action{border:1px solid var(--line);background:#ffffff0b;padding:11px 14px;border-radius:14px;font-size:13px}.action.primary{background:linear-gradient(120deg,#7655cb,#397f9b);border-color:#ffffff30}
.row{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.stat{padding:14px;border:1px solid var(--line);background:#ffffff08;border-radius:16px}.stat b{font-size:22px;display:block}.stat span{font-size:11px;color:var(--muted)}
.chat-list{display:grid;gap:7px}.chat-item{width:100%;text-align:left;border:1px solid var(--line);background:#ffffff08;border-radius:13px;padding:12px;color:#ddd;font-size:13px}
@keyframes appear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}
@media(min-width:700px){.app{padding-top:20px;padding-bottom:20px}.welcome{padding-bottom:45px}}
</style></head>
<body><div class="app">
<header class="glass">
<button class="icon-btn" id="historyBtn" aria-label="История чатов"><svg viewBox="0 0 24 24"><path d="M20 11.5a7.5 7.5 0 0 1-7.5 7.5H5l-2 2v-9.5A7.5 7.5 0 0 1 10.5 4H12"/></svg></button>
<button class="brand" id="brandBtn" aria-label="Информация о Baxi"><strong>Baxi</strong><span class="version">v 1.0</span><svg class="chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
<button class="icon-btn" id="settingsBtn" aria-label="Настройки"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.4 1.1-1.4 2.4-1.7-.7a8 8 0 0 1-1.7 1l-.3 1.8h-2.8l-.3-1.8a8 8 0 0 1-1.7-1l-1.7.7-1.4-2.4 1.4-1.1a7 7 0 0 1 0-2l-1.4-1.1 1.4-2.4 1.7.7a8 8 0 0 1 1.7-1l.3-1.8h2.8l.3 1.8a8 8 0 0 1 1.7 1l1.7-.7 1.4 2.4-1.4 1.1a7 7 0 0 1 0 2Z" transform="translate(-1 -1) scale(1.08)"/></svg></button>
</header>
<main id="chatArea"><section class="welcome" id="welcome"><div class="orb"><svg viewBox="0 0 24 24"><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/><circle cx="12" cy="12" r="4.5"/></svg></div><h1>Чем могу помочь?</h1><p>Я Baxi — твой ИИ-помощник. Задай вопрос, попроси объяснить тему или придумай что-нибудь вместе со мной.</p><div class="suggestions"><button class="chip">Объясни сложную тему просто</button><button class="chip">Помоги написать текст</button><button class="chip">Придумай идею проекта</button></div></section></main>
<div class="composer glass"><button class="icon-btn" id="attachBtn" aria-label="Прикрепить файл" style="width:42px;height:42px"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button><input id="prompt" placeholder="Сообщение…" autocomplete="off" aria-label="Сообщение"><button class="icon-btn" id="micBtn" aria-label="Голосовой ввод" style="width:42px;height:42px"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3m-4 0h8"/></svg></button><button class="send" id="sendBtn" aria-label="Отправить"><svg viewBox="0 0 24 24"><path d="M12 19V5m-6 6 6-6 6 6"/></svg></button></div>
<div class="status" id="status">Baxi AI · готов к работе</div></div>
<div class="overlay" id="overlay"><section class="sheet glass"><div class="sheet-head"><h2 id="sheetTitle">Настройки</h2><button class="icon-btn" id="closeSheet" aria-label="Закрыть" style="width:36px;height:36px">×</button></div><div id="sheetBody"></div></section></div>
<script>
const $=s=>document.querySelector(s), area=$('#chatArea'), input=$('#prompt');
let currentId=null, chats=JSON.parse(localStorage.getItem('baxi_chats')||'[]'), apiBase=localStorage.getItem('baxi_api')||'http://127.0.0.1:8000';
function save(){localStorage.setItem('baxi_chats',JSON.stringify(chats))}
function current(){return chats.find(c=>c.id===currentId)}
function newChat(){currentId=String(Date.now());chats.unshift({id:currentId,title:'Новый чат',messages:[]});save();render()}
function render(){area.innerHTML='';const c=current();if(!c||!c.messages.length){area.innerHTML=$('#welcome').outerHTML;area.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{input.value=b.textContent;send()});return}
c.messages.forEach((m,i)=>{const wrap=document.createElement('div');wrap.className='message '+(m.role==='user'?'user':'assistant');const b=document.createElement('div');b.className='bubble';b.textContent=m.text;wrap.append(b);area.append(wrap);if(m.role==='assistant'){const tools=document.createElement('div');tools.className='msg-tools';['👍','👎','Копировать'].forEach((v)=>{const btn=document.createElement('button');btn.className='tiny';btn.textContent=v;btn.onclick=()=>v==='Копировать'?navigator.clipboard?.writeText(m.text):rate(i,v==='👍'?1:-1);tools.append(btn)});area.append(tools)}});area.scrollTop=area.scrollHeight}
function add(role,text){const c=current();c.messages.push({role,text});if(role==='user'&&c.title==='Новый чат')c.title=text.slice(0,34);save();render()}
async function send(){const text=input.value.trim();if(!text)return;if(!currentId)newChat();input.value='';add('user',text);const c=current();const placeholder={role:'assistant',text:'Думаю…'};c.messages.push(placeholder);render();try{const r=await fetch(apiBase.replace(/\/$/,'')+'/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history:c.messages.slice(0,-1).slice(-12)})});if(!r.ok)throw Error('server');const data=await r.json();placeholder.text=data.answer||'Не удалось получить ответ.';placeholder.id=data.message_id;$('#status').textContent='Baxi AI · ответ получен'}catch(e){placeholder.text=offlineAnswer(text);$('#status').textContent='Локальный режим · сервер не подключён'}save();render()}
function offlineAnswer(t){const s=t.toLowerCase();if(/привет|здравств/.test(s))return'Привет! Я Baxi. Пока сервер ИИ не подключён, но интерфейс работает. Подключи Python-сервер в настройках, чтобы получать ответы и сохранять аналитику.';if(/кто ты|что ты умеешь/.test(s))return'Я Baxi — интерфейс ИИ-помощника. После подключения сервера смогу обрабатывать вопросы, сохранять историю и улучшать базу знаний по оценкам ответов.';return'Я получил твоё сообщение, но сейчас работаю в автономном режиме. Чтобы получать полноценные ответы, запусти Python-сервер и укажи его адрес в настройках. Твой вопрос не потерян — он остаётся в истории этого чата.'}
async function rate(index,value){const m=current()?.messages[index];if(!m)return;try{await fetch(apiBase.replace(/\/$/,'')+'/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message_id:m.id,rating:value})})}catch{}$('#status').textContent='Спасибо за оценку!'}
function openSheet(title,html){$('#sheetTitle').textContent=title;$('#sheetBody').innerHTML=html;$('#overlay').classList.add('show')}
function closeSheet(){$('#overlay').classList.remove('show')}
$('#sendBtn').onclick=send;input.addEventListener('keydown',e=>{if(e.key==='Enter')send()});$('#closeSheet').onclick=closeSheet;$('#overlay').onclick=e=>{if(e.target.id==='overlay')closeSheet()};
$('#historyBtn').onclick=()=>{if(!chats.length)chats=[{id:String(Date.now()),title:'Новый чат',messages:[]}];openSheet('История чатов',`<div class="row" style="margin-bottom:12px"><button class="action primary" id="newChat">＋ Новый чат</button></div><div class="chat-list">${chats.map(c=>`<button class="chat-item" data-id="${c.id}">${escapeHtml(c.title)}</button>`).join('')}</div>`);$('#newChat').onclick=()=>{newChat();closeSheet()};document.querySelectorAll('.chat-item').forEach(b=>b.onclick=()=>{currentId=b.dataset.id;render();closeSheet()})};
$('#settingsBtn').onclick=()=>openSheet('Настройки',`<p style="color:#aaa;font-size:13px;line-height:1.5">Укажи адрес запущенного Python API. Например, адрес сервера в локальной сети или опубликованного backend.</p><label class="field">Адрес API<input id="apiInput" value="${escapeHtml(apiBase)}" placeholder="https://your-server.example.com"></label><div class="row"><button class="action primary" id="saveApi">Сохранить</button><button class="action" id="testApi">Проверить сервер</button><button class="action" id="statsBtn">Аналитика</button></div><p id="apiResult" style="font-size:12px;color:#aaa"></p>`);$('#saveApi').onclick=()=>{apiBase=$('#apiInput').value.trim().replace(/\/$/,'');localStorage.setItem('baxi_api',apiBase);$('#apiResult').textContent='Адрес сохранён'};$('#testApi').onclick=async()=>{try{let r=await fetch(apiBase+'/health');$('#apiResult').textContent=r.ok?'Сервер доступен':'Сервер ответил с ошибкой'}catch{$('#apiResult').textContent='Не удалось подключиться'}};$('#statsBtn').onclick=async()=>{try{let d=await(await fetch(apiBase+'/analytics')).json();openSheet('Аналитика',`<div class="statgrid"><div class="stat"><b>${d.total_messages}</b><span>Сообщений</span></div><div class="stat"><b>${d.known_answers}</b><span>Записей базы знаний</span></div><div class="stat"><b>${d.positive_feedback}</b><span>Положительных оценок</span></div><div class="stat"><b>${d.negative_feedback}</b><span>Отрицательных оценок</span></div></div><p style="color:#aaa;font-size:12px">Популярные темы: ${(d.top_topics||[]).map(x=>escapeHtml(x.topic)).join(', ')||'пока нет данных'}</p>`)}catch{$('#apiResult').textContent='Сначала подключи сервер'}}};
$('#brandBtn').onclick=()=>openSheet('О Baxi',`<p style="color:#bbb;font-size:13px;line-height:1.6">Baxi AI v1.0<br>Мобильный ИИ-чат с Python API, историей диалогов, обратной связью и локальной базой знаний.</p><p style="color:#858596;font-size:11px">Ответы сервера зависят от подключённого движка. Не отправляй в чат пароли и личные данные.</p>`);
$('#attachBtn').onclick=()=>openSheet('Файлы',`<p style="color:#aaa;font-size:13px">Прикрепление файлов можно добавить на следующем этапе. Сейчас отправка текстовых сообщений полностью поддерживается.</p>`);
$('#micBtn').onclick=()=>{const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$('#status').textContent='Голосовой ввод не поддерживается этим браузером';return}const rec=new SR();rec.lang='ru-RU';rec.onresult=e=>{input.value=e.results[0][0].transcript};rec.start();$('#status').textContent='Слушаю…'};
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
if(chats.length)currentId=chats[0].id;render();
</script></body></html>
